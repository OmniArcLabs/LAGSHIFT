name: macOS preview build

on:
  push:
    branches: [macos]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            label: Intel
          - runner: macos-15
            label: Apple-Silicon
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install locked build dependencies
        run: python -m pip install -r requirements-macos-build.txt
      - name: Run tests
        run: >-
          python -m unittest -v
          tests.test_macos_platform
          tests.test_security_adversarial
          tests.test_traffic_tariff_service
      - name: Build and verify native app
        run: ./build-macos.sh
      - name: Upload ${{ matrix.label }} packages
        uses: actions/upload-artifact@v4
        with:
          name: LAGSHIFT-macOS-${{ matrix.label }}
          path: |
            dist/LAGSHIFT-1.2.0-macOS-*.zip
            dist/LAGSHIFT-1.2.0-macOS-*.dmg
          if-no-files-found: error
          retention-days: 14
