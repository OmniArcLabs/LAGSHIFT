name: macOS preview build

on:
  push:
    branches: [macos]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            label: Intel
          - runner: macos-15
            label: Apple-Silicon
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install locked build dependencies
        run: >-
          python -m pip install --only-binary=:all:
          -r requirements-macos-build.txt
      - name: Verify cryptography runtime
        run: >-
          python -c "from cryptography.hazmat.backends.openssl.backend import backend;
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM;
          print('cryptography OpenSSL:', backend.openssl_version_text());
          AESGCM.generate_key(bit_length=256)"
      - name: Run tests
        shell: bash
        run: |
          set +e
          python -m unittest -v \
            tests.test_macos_platform \
            tests.test_macos_ui_smoke \
            tests.test_security_adversarial \
            tests.test_traffic_tariff_service 2>&1 | tee macos-tests.log
          status=${PIPESTATUS[0]}
          set -e
          if [[ $status -ne 0 ]]; then
            output="$(tail -n 80 macos-tests.log)"
            output="${output//'%'/'%25'}"
            output="${output//$'\r'/'%0D'}"
            output="${output//$'\n'/'%0A'}"
            echo "::error title=macOS native UI/test failure::${output:0:6000}"
            exit "$status"
          fi
      - name: Build and verify native app
        run: ./build-macos.sh
      - name: Upload ${{ matrix.label }} packages
        uses: actions/upload-artifact@v6
        with:
          name: LAGSHIFT-macOS-${{ matrix.label }}
          path: |
            dist/LAGSHIFT-1.2.0-macOS-*.zip
            dist/LAGSHIFT-1.2.0-macOS-*.dmg
          if-no-files-found: error
          retention-days: 14
