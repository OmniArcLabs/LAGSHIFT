name: Activate LAGSHIFT 1.3.0 In-App Update

on:
  push:
    branches: [main]
    paths:
      - .github/release-requests/activate-v1.3.0-update

permissions:
  contents: write

concurrency:
  group: activate-lagshift-v1.3.0-update
  cancel-in-progress: false

jobs:
  sign-verify-and-publish:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
      LAGSHIFT_UPDATE_PRIVATE_KEY_B64: ${{ secrets.LAGSHIFT_UPDATE_PRIVATE_KEY_B64 }}

    steps:
      - name: Check out main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install manifest dependency
        shell: pwsh
        run: python -m pip install --disable-pip-version-check "cryptography==45.0.7"

      - name: Require the existing offline signing key
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:LAGSHIFT_UPDATE_PRIVATE_KEY_B64)) {
            throw 'Repository secret LAGSHIFT_UPDATE_PRIVATE_KEY_B64 is missing. The trusted update key must not be replaced.'
          }

      - name: Download the published Light installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\lagshift-update" | Out-Null
          gh release download v1.3.0 `
            --repo $env:GITHUB_REPOSITORY `
            --pattern 'LAGSHIFT-1.3.0-Setup-Light.exe' `
            --dir "$env:RUNNER_TEMP\lagshift-update" `
            --clobber

      - name: Create signed Stable and Beta manifests
        shell: pwsh
        run: |
          $installer = "$env:RUNNER_TEMP\lagshift-update\LAGSHIFT-1.3.0-Setup-Light.exe"
          $downloadUrl = 'https://github.com/OmniArcLabs/LAGSHIFT/releases/download/v1.3.0/LAGSHIFT-1.3.0-Setup-Light.exe'
          $releaseUrl = 'https://github.com/OmniArcLabs/LAGSHIFT/releases/tag/v1.3.0'
          $notes = 'FusionDNS Hybrid: مقایسه DNSهای ایرانی و خارجی، سنجش پوشش مقصدهای Login/API/CDN، انتخاب مسیر کامل‌تر و بازگردانی امن تنظیم قبلی.'
          python tools/create_update_manifest.py $installer `
            --version 1.3.0 --channel stable --url $downloadUrl `
            --release-url $releaseUrl --notes $notes `
            --output update-manifest-stable.json
          python tools/create_update_manifest.py $installer `
            --version 1.3.0 --channel beta --url $downloadUrl `
            --release-url $releaseUrl --notes $notes `
            --output update-manifest-beta.json

      - name: Verify manifests with the public key embedded in LAGSHIFT
        shell: pwsh
        run: |
          @'
          import json
          from pathlib import Path
          from app.app_info import UPDATE_PUBLIC_KEY_B64
          from app.services.update_service import verify_manifest

          for channel in ("stable", "beta"):
              path = Path(f"update-manifest-{channel}.json")
              document = json.loads(path.read_text(encoding="utf-8"))
              verified = verify_manifest(document, UPDATE_PUBLIC_KEY_B64, channel)
              assert verified["version"] == "1.3.0"
          print("Both update manifests are trusted by installed LAGSHIFT clients.")
          '@ | python -

      - name: Commit the trusted manifests
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add update-manifest-stable.json update-manifest-beta.json
          git diff --cached --exit-code
          if ($LASTEXITCODE -eq 0) {
            throw 'The signed manifests did not change.'
          }
          git commit -m 'Activate signed 1.3.0 in-app update'
          git push origin HEAD:main
